# Ambiente local: PostgreSQL + aplicação. Ver docs/instalacao.md.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fight
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fight}
      POSTGRES_DB: fight_manager
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fight -d fight_manager"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgres://fight:${POSTGRES_PASSWORD:-fight}@db:5432/fight_manager
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      # localmente o acesso é por http://localhost; em produção, use HTTPS e remova esta linha
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # e-mail (ver docs/instalacao.md): preencha no .env; vazio = e-mails só no log (docker compose logs app)
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # contas de teste na tela de login (o seed cria; ver README)
      SHOW_TEST_ACCOUNTS: ${SHOW_TEST_ACCOUNTS:-true}
      # aviso de erro do servidor (Discord, Slack, ntfy...); vazio = só no log
      ERROR_WEBHOOK_URL: ${ERROR_WEBHOOK_URL:-}
      # tarefa diária (geração automática e lembretes): o serviço scheduler usa o mesmo segredo
      CRON_SECRET: ${CRON_SECRET:-troque-este-segredo-local}
      APP_URL: ${APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # chama a tarefa diária de hora em hora (ela é idempotente: gerar e lembrar só uma vez)
  scheduler:
    image: alpine:3.20
    environment:
      CRON_SECRET: ${CRON_SECRET:-troque-este-segredo-local}
    entrypoint: ["/bin/sh", "-c", "sleep 60; while true; do wget -q -O - --header \"Authorization: Bearer $$CRON_SECRET\" --post-data '' http://app:3000/api/tarefas/diarias || echo 'Tarefa diária falhou'; echo; sleep 3600; done"]
    depends_on:
      - app

  # backup diário do banco, guardado em ./backups por KEEP_DAYS dias (ver docs/instalacao.md)
  backup:
    image: postgres:16-alpine
    environment:
      DATABASE_URL: postgres://fight:${POSTGRES_PASSWORD:-fight}@db:5432/fight_manager
      BACKUP_DIR: /backups
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./scripts/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "-c", "while true; do sh /backup.sh || echo 'Backup falhou'; sleep 86400; done"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
